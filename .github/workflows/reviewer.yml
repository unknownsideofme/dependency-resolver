name: AI Code Review

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reviewer-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Gemini AI Review
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout the PR's actual HEAD
      # ------------------------------------------------------------
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Install Go
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # ------------------------------------------------------------
      # 3. Build custom reviewer from PR #1233
      # ------------------------------------------------------------
      - name: Build reviewer
        shell: bash
        run: |
          set -euo pipefail

          git clone https://github.com/alibaba/open-code-review.git /tmp/open-code-review
          cd /tmp/open-code-review

          git fetch origin pull/1233/head:pr-1233
          git checkout pr-1233

          echo "Building reviewer from:"
          git log -1 --oneline

          go build \
            -ldflags "-s -w -X main.Version=1.12.7-pr1233" \
            -o /usr/local/bin/reviewer \
            ./cmd/opencodereview

          reviewer version

      # ------------------------------------------------------------
      # 4. Configure Gemini
      # ------------------------------------------------------------
      - name: Configure Gemini
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${GEMINI_API_KEY}" ]]; then
            echo "GEMINI_API_KEY secret is not configured."
            exit 1
          fi

          reviewer config set custom_providers.gemini.url \
            "https://generativelanguage.googleapis.com/v1beta/openai"

          reviewer config set custom_providers.gemini.protocol \
            "openai"

          reviewer config set custom_providers.gemini.model \
            "gemini-3.5-flash-lite"

          reviewer config set custom_providers.gemini.api_key \
            "${GEMINI_API_KEY}"

          reviewer config set provider gemini

          echo "Testing Gemini connection..."
          reviewer llm test

      # ------------------------------------------------------------
      # 5. Run AI review
      # ------------------------------------------------------------
      - name: Run AI review
        id: ocr
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Reviewing:"
          echo "  Base: ${BASE_SHA}"
          echo "  Head: ${HEAD_SHA}"

          reviewer review \
            --from "${BASE_SHA}" \
            --to "${HEAD_SHA}" \
            --concurrency 1 \
            --effort low \
            --max-tokens 8000 \
            --format json \
            > /tmp/reviewer-result.json

          echo "Review completed."

          echo "===== REVIEW JSON ====="
          cat /tmp/reviewer-result.json
          echo "======================="

      # ------------------------------------------------------------
      # 6. Upload raw result for debugging
      # ------------------------------------------------------------
      - name: Upload review result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-result-${{ github.run_id }}
          path: /tmp/reviewer-result.json
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # 7. Post findings to GitHub
      # ------------------------------------------------------------
      - name: Post review comments
        if: success()
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: /tmp/reviewer-result.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;

