name: Daily Benchmark Suite

on:
  push:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    name: Run Benchmarks and Export Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh npm package pool
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 1'
        run: node benchmark/config/scripts/package-gen.js
        env:
          NODE_NO_WARNINGS: "1"
        continue-on-error: true

      - name: Run all 11 benchmark suites
        run: npm run benchmark
        env:
          NODE_NO_WARNINGS: "1"

      - name: Export CSVs to metrics.json
        run: npm run benchmark:export

      - name: Commit benchmark results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark/data/ benchmark/config/large-package.json
          if ! git diff --cached --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore(benchmark): daily run ${TIMESTAMP} [skip ci]"
            git push
          fi
